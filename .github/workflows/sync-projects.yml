name: Sync projects from website

on:
  workflow_dispatch:
  repository_dispatch:
    types: [projects-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save smol-toml@1
      - run: node scripts/sync-projects.mjs
      - name: Commit changes
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync projects from website"
          git push
